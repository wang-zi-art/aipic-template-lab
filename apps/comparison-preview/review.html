<!doctype html>
<!-- 石墨蓝紫结果评审页模板：由批次汇总写入真实 summary 快照与相对图片路径。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>逐例评审台 · 本轮结果</title>
    <link rel="stylesheet" href="workbench-theme.css" />
    <link rel="stylesheet" href="review.css" />
    <script id="comparisonData" type="application/json">
      __COMPARISON_SUMMARY__
    </script>
    <script src="review.js" defer></script>
  </head>
  <body data-theme="midnight">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-symbol">◈</span><span>AIPIC <b>/</b> LAB</span>
        </div>
        <div class="top-center">
          <span class="top-kicker">TEMPLATE REVIEW</span><span class="top-separator"></span
          ><span>逐例评审台</span>
        </div>
        <div class="run-indicator">
          <span class="signal"></span><span id="reportState">本轮结果</span>
        </div>
      </header>
      <div class="review-ribbon">
        <strong>本地结果快照</strong><span id="snapshotTime"></span><span>·</span
        ><span>以原始 report.json 和后台状态为准</span>
      </div>
      <div class="workspace">
        <aside class="case-sidebar" aria-label="测试用例">
          <div class="sidebar-head">
            <span class="eyebrow">THIS BATCH</span>
            <h2>测试用例</h2>
            <p>逐组检查候选结果的差异</p>
          </div>
          <div id="caseList" class="case-list"></div>
          <div class="sidebar-bottom">
            <span class="signal"></span>
            <div><strong id="sidebarStatus">本轮汇总</strong><small id="sidebarCount"></small></div>
          </div>
        </aside>
        <main class="main-panel">
          <div class="breadcrumb">
            <span id="crumbTemplate"></span><span>/</span><span id="crumbCase"></span><span>/</span
            ><strong>候选对比</strong>
          </div>
          <section class="heading">
            <div>
              <span class="eyebrow teal">CASE REVIEW · <span id="caseCounter"></span></span>
              <h1 id="caseTitle"></h1>
              <p id="caseFocus"></p>
            </div>
            <div class="case-nav">
              <button id="prevCase" type="button" aria-label="上一用例">←</button
              ><button id="nextCase" type="button" aria-label="下一用例">→</button>
            </div>
          </section>
          <div class="meta-bar">
            <div class="meta-item"><span>模板类型</span><strong id="templateName"></strong></div>
            <div class="meta-item"><span>图片比例</span><strong id="ratio"></strong></div>
            <div class="meta-item"><span>生成规格</span><strong id="resolution"></strong></div>
            <div class="meta-item">
              <span>候选版本</span><strong id="candidateVersions"></strong>
            </div>
          </div>
          <div class="compare-toolbar">
            <div>
              <span class="toolbar-dot"></span><strong>同步视图</strong
              ><span class="hint">在任一结果图上拖动，候选图同步移动</span>
            </div>
            <div class="zoom-controls">
              <button id="zoomOut" type="button" aria-label="缩小">−</button
              ><output id="zoomValue" aria-live="polite">100%</output
              ><button id="zoomIn" type="button" aria-label="放大">＋</button
              ><button id="resetZoom" type="button" class="reset">重置视图</button>
            </div>
          </div>
          <section id="resultGrid" class="result-grid" aria-label="候选结果对比"></section>
          <div class="main-footer">
            <span>← → 切换用例　·　＋ / − 缩放　·　拖动图片同步平移</span
            ><span id="casePosition"></span>
          </div>
        </main>
        <aside class="inspector" aria-label="用例信息">
          <div class="inspector-title">
            <span class="eyebrow">SOURCE & CONTEXT</span>
            <h2>输入与说明</h2>
          </div>
          <div id="sourceList" class="source-list"></div>
          <div class="info-block">
            <span>补充描述</span>
            <p id="inspectorFocus"></p>
          </div>
          <div class="info-block">
            <span>本轮执行</span>
            <p class="mono" id="executionShort"></p>
          </div>
          <div class="inspector-note">
            候选图默认完整显示。放大后的位置同步，便于观察同一部位；不同构图请结合全图判断。
          </div>
        </aside>
      </div>
    </div>
    <dialog id="sourceDialog" class="source-dialog" aria-label="查看输入图片">
      <div class="dialog-top">
        <strong id="dialogTitle"></strong
        ><button id="closeDialog" type="button" aria-label="关闭">×</button>
      </div>
      <img id="dialogImage" alt="" />
    </dialog>
  </body>
</html>
